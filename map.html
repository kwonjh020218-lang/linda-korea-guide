<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Linda's Korea Guide 🍵 — Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="map-page">
  <header class="header">
    <div class="header__row">
      <div class="brand">
        <h1 class="brand__title">Linda's Korea Guide 🍵</h1>
        <p class="brand__sub">Map view</p>
      </div>
      <div class="viewtoggle" role="group" aria-label="View mode">
        <a href="index.html" aria-pressed="false">List</a>
        <button type="button" aria-pressed="true">Map</button>
      </div>
    </div>
    <div class="cities" id="city-tabs" role="group" aria-label="Choose a city" style="margin-top:12px">
      <button type="button" class="tab" data-city="seoul" aria-pressed="true">Seoul</button>
      <button type="button" class="tab" data-city="busan" aria-pressed="false">Busan</button>
    </div>
    <div class="chiprow" id="category-chips" role="group" aria-label="Categories" style="margin-top:8px"><!-- map.js --></div>
  </header>

  <div id="map"></div>
  <button type="button" id="locate-btn" class="locate-fab" title="Find me">📍</button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="data.js"></script>
  <script src="coords.js"></script>
  <script src="map.js"></script>
</body>
</html>
