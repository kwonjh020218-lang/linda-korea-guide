<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Matcha Guide 🍵 — Map</title>
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <link rel="stylesheet" href="vendor/MarkerCluster.css" />
  <link rel="stylesheet" href="vendor/MarkerCluster.Default.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
</head>
<body class="map-page">
  <header class="header">
    <div class="header__row">
      <div class="brand">
        <h1 class="brand__title">Matcha Guide 🍵</h1>
        <p class="brand__sub">Map view</p>
      </div>
      <div class="viewtoggle" role="group" aria-label="View mode">
        <a href="index.html" aria-pressed="false">List</a>
        <button type="button" aria-pressed="true">Map</button>
        <a href="courses.html" aria-pressed="false" aria-label="Courses">🧭</a>
        <a href="mytrip.html" aria-pressed="false" aria-label="My Trip">❤️</a>
      </div>
    </div>
    <div class="cities" id="city-tabs" role="group" aria-label="Choose a city" style="margin-top:12px">
      <button type="button" class="tab" data-city="seoul" aria-pressed="true">Seoul</button>
      <button type="button" class="tab" data-city="busan" aria-pressed="false">Busan</button>
      <button type="button" class="tab" data-city="tokyo" aria-pressed="false">Tokyo</button>
    </div>
    <div class="chiprow" id="category-chips" role="group" aria-label="Categories" style="margin-top:8px"><!-- map.js --></div>
  </header>

  <div id="map"></div>
  <button type="button" id="locate-btn" class="locate-fab" title="Find me">📍</button>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/leaflet.markercluster.js"></script>
  <script src="data.js"></script>
  <script src="coords.js"></script>
  <script src="map.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
