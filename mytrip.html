<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>My Trip ❤️ — Matcha Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header__row">
      <div class="brand">
        <h1 class="brand__title">My Trip ❤️</h1>
        <p class="brand__sub">Saved &amp; visited</p>
      </div>
      <div class="viewtoggle" role="group" aria-label="View mode">
        <a href="index.html" aria-pressed="false">List</a>
        <a href="map.html" aria-pressed="false">Map</a>
        <a href="courses.html" aria-pressed="false" aria-label="Courses">🧭</a>
        <button type="button" aria-pressed="true" aria-label="My Trip">❤️</button>
      </div>
    </div>
  </header>

  <section class="filters">
    <div class="trip-stats" id="trip-stats"></div>
    <div class="addspot">
      <div class="search">
        <span aria-hidden="true">➕</span>
        <input type="search" id="add-search" placeholder="Add a spot to your plan…" aria-label="Add a spot from the guide" autocomplete="off" />
      </div>
      <div class="add-results" id="add-results"></div>
    </div>
  </section>

  <main class="results" id="trip-body"><!-- mytrip.js --></main>

  <footer>🍵 Your Korea trip</footer>
</div>

<div id="toast" class="toast" hidden></div>

<script src="data.js"></script>
<script src="coords.js"></script>
<script src="store.js"></script>
<script src="mytrip.js"></script>
<script src="pwa.js"></script>
</body>
</html>
